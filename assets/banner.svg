<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#14313a"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1c2b36"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#1f2f3a" stroke-width="2"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1200" height="46" rx="18" fill="#0d1a24"/>
  <rect x="0" y="30" width="1200" height="16" fill="#0d1a24"/>
  <circle cx="32" cy="23" r="6.5" fill="#cd7f32"/>
  <circle cx="54" cy="23" r="6.5" fill="#c0c0c0"/>
  <circle cx="76" cy="23" r="6.5" fill="#d4af37"/>
  <text x="600" y="28" text-anchor="middle" fill="#5b7383" font-size="13" letter-spacing="1">bronze&#8202;&#8594;&#8202;silver&#8202;&#8594;&#8202;gold</text>

  <!-- terminal body -->
  <text x="46" y="100" fill="#3fb8a3" font-size="20" font-weight="600">avinash@pipeline</text><text x="240" y="100" fill="#5b7383" font-size="20">:~$ cat role.txt</text>
  <text x="46" y="134" fill="#e7f1ef" font-size="24" font-weight="700">&gt; Aspiring Azure Data Engineer</text>

  <text x="46" y="184" fill="#3fb8a3" font-size="20" font-weight="600">avinash@pipeline</text><text x="240" y="184" fill="#5b7383" font-size="20">:~$ cat status.txt</text>
  <text x="46" y="218" fill="#9fb4bd" font-size="20">
    <tspan fill="#e7f1ef">open_to_internship</tspan>=true &#183; mumbai, in &#183; remote_ok=true
  </text>

  <text x="46" y="254" fill="#3fb8a3" font-size="20" font-weight="600">avinash@pipeline</text><text x="240" y="254" fill="#5b7383" font-size="20">:~$</text>
  <rect x="270" y="238" width="12" height="22" fill="#3fb8a3">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
